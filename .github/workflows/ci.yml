name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest Pillow python-dotenv

      - name: Compile check (all entry points)
        run: |
          python -m py_compile \
            apps/caption/caption.py \
            apps/studio/app.py apps/studio/gui.py \
            apps/studio/voiceover.py apps/studio/models_setup.py

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Docs match the code
        run: python tools/check_docs.py

  gui-smoke:
    # Tk needs a real display: xvfb lets us construct the window headlessly
    # and catch pack/layout regressions that a plain import cannot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install GUI deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest Pillow python-dotenv
          sudo apt-get update && sudo apt-get install -y xvfb tk

      - name: Construct GUI headlessly
        run: xvfb-run -a python tools/gui_smoke.py
