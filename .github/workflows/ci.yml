name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest Pillow python-dotenv

      - name: Compile check (all entry points)
        run: |
          python -m py_compile \
            image_to_text/caption.py \
            video_voiceover/app.py video_voiceover/gui.py \
            video_voiceover/voiceover.py video_voiceover/models_setup.py

      - name: Run tests
        run: python -m pytest tests/ -q
