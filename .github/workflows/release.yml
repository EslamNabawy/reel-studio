name: Release

# Ship the Windows desktop app: PyInstaller bundle + Inno Setup installer,
# attached to a GitHub Release. Trigger by pushing a tag like v1.0.0,
# or manually via "Run workflow" (uses install.iss AppVersion as fallback).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $v = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $m = Select-String -Path video_voiceover/install.iss -Pattern '#define AppVersion "([^"]+)"'
            $v = $m.Matches[0].Groups[1].Value
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "version: $v"

      - name: Stamp installer version
        run: |
          $iss = "video_voiceover/install.iss"
          $v = "${{ steps.ver.outputs.version }}"
          (Get-Content $iss) -replace '#define AppVersion "[^"]+"', "#define AppVersion `"$v`"" |
            Set-Content $iss
          Select-String -Path $iss -Pattern '#define AppVersion'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system tools (ffmpeg, Inno Setup)
        run: choco install ffmpeg innosetup -y --no-progress

      - name: Install Python deps (CPU torch first, keeps image small)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r video_voiceover/requirements.txt
          pip install pyinstaller pytest Pillow python-dotenv

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: Build app bundle
        working-directory: video_voiceover
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Build installer
        working-directory: video_voiceover
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" install.iss
          Get-ChildItem release/

      - name: Pack portable zip
        working-directory: video_voiceover
        run: |
          Compress-Archive -Path dist/VideoVoiceOver `
            -DestinationPath "release/VideoVoiceOver-${{ steps.ver.outputs.version }}-portable.zip"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: video_voiceover
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          $files = Get-ChildItem release/*.exe, release/*.zip | ForEach-Object { $_.FullName }
          if (gh release view $tag --repo ${{ github.repository }} 2>$null) {
            gh release upload $tag $files --repo ${{ github.repository }} --clobber
          } else {
            gh release create $tag $files --repo ${{ github.repository }} `
              --title "Reel $tag" --generate-notes
          }
